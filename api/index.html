<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 자동 독서 퀴즈</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-amber-50/70 text-slate-800 flex flex-col items-center py-10 px-4">
  <div class="w-full max-w-xl">
    <header class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-amber-500 text-white rounded-2xl shadow-md mb-3 text-2xl">
        📚
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
        AI 자동 독서 퀴즈
      </h1>
      <p class="text-sm text-slate-600 mt-1.5">
        책 제목과 출판사를 입력하면 줄거리를 파악해 맞춤형 퀴즈를 만들어 드려요.
      </p>
    </header>

    <section id="step-input" class="bg-white rounded-3xl shadow-sm border border-amber-100 p-6 sm:p-8 space-y-5">
      <div id="error-box" class="hidden p-3.5 rounded-xl bg-red-50 text-red-600 text-sm font-medium"></div>

      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">
          책 제목 <span class="text-red-500">*</span>
        </label>
        <input
          id="input-title"
          type="text"
          placeholder="예: 마당을 나온 암탉, 어린 왕자"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-400"
        />
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">
          출판사 <span class="text-slate-400 font-normal">(입력 시 정확도 향상)</span>
        </label>
        <input
          id="input-publisher"
          type="text"
          placeholder="예: 사계절, 문학동네, 비룡소"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-400"
        />
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">퀴즈 난이도</label>
        <div id="difficulty-group" class="grid grid-cols-3 gap-2.5">
          <button type="button" data-level="초등 저학년" class="diff-btn py-2.5 px-3 rounded-xl text-sm font-semibold border bg-slate-50 text-slate-600 border-slate-200">
            초등 저학년
          </button>
          <button type="button" data-level="초등 고학년" class="diff-btn py-2.5 px-3 rounded-xl text-sm font-semibold border bg-amber-500 text-white border-amber-500 shadow-sm">
            초등 고학년
          </button>
          <button type="button" data-level="청소년·성인" class="diff-btn py-2.5 px-3 rounded-xl text-sm font-semibold border bg-slate-50 text-slate-60
